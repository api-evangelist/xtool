aid: xtool
name: xTool
description: >-
  xTool is a Shenzhen-based digital-fabrication brand, spun out of Makeblock and backed
  by HongShan, making CO2, fiber, and diode laser cutters and engravers, laser welders,
  and DTF printers for makers and small businesses, driven by its xTool Creative Space
  (XCS) desktop software. xTool sells through a Shopify storefront and runs a support
  and academy portal, a user community, and the Atomm maker-project platform, but
  publishes no public developer API, SDK, or API documentation.
